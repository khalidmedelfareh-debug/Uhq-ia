
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uhq IA 👑</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #212121;
  color: white;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
}

.sidebar {
  width: 240px;
  background: #171717;
  padding: 22px;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 35px;
}

.new-chat {
  background: #303030;
  padding: 13px;
  border-radius: 10px;
  cursor: pointer;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 25px;
  min-width: 0;
}

.top {
  width: 100%;
  font-size: 19px;
  font-weight: bold;
}

.welcome {
  margin: auto;
  text-align: center;
}

.welcome h1 {
  font-size: 30px;
}

.welcome p {
  color: #aaa;
}

.messages {
  width: 100%;
  max-width: 750px;
  flex: 1;
  overflow-y: auto;
  padding: 20px 0;
}

.message {
  padding: 14px 18px;
  border-radius: 18px;
  margin: 12px 0;
  max-width: 85%;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.user {
  background: #343434;
  margin-left: auto;
}

.bot {
  background: #292929;
  margin-right: auto;
}

.message img {
  max-width: 180px;
  border-radius: 12px;
  display: block;
  margin-bottom: 8px;
}

#preview {
  width: 100%;
  max-width: 750px;
  display: flex;
  gap: 10px;
  padding: 5px;
}

.preview-item {
  position: relative;
}

.preview-item img {
  width: 65px;
  height: 65px;
  object-fit: cover;
  border-radius: 10px;
}

.remove {
  position: absolute;
  top: -7px;
  right: -7px;
  background: #555;
  color: white;
  border: none;
  border-radius: 50%;
  cursor: pointer;
}

.chat-box {
  width: 100%;
  max-width: 750px;
  background: #303030;
  border-radius: 25px;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}

.chat-box input[type="text"] {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 16px;
  padding: 10px;
}

.photo-button {
  font-size: 26px;
  cursor: pointer;
  padding: 5px;
}

.send {
  background: white;
  color: black;
  border: none;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  font-size: 21px;
  cursor: pointer;
}

@media(max-width:600px) {
  .sidebar {
    display: none;
  }

  .main {
    padding: 15px;
  }

  .welcome h1 {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<aside class="sidebar">
  <div class="logo">👑 Uhq IA</div>
  <div class="new-chat" onclick="newChat()">
    ＋ Nouveau chat
  </div>
</aside>

<main class="main">

  <div class="top">Uhq IA 👑</div>

  <div class="welcome" id="welcome">
    <h1>Comment puis-je t'aider ?</h1>
    <p>Pose-moi une question ou envoie une photo.</p>
  </div>

  <div class="messages" id="messages"></div>

  <div id="preview"></div>

  <div class="chat-box">

    <label class="photo-button" for="photo">＋</label>

    <input
      type="file"
      id="photo"
      accept="image/*"
      multiple
      hidden
      onchange="showPhoto(event)"
    >

    <input
      type="text"
      id="input"
      placeholder="Écris à Uhq IA..."
    >

    <button class="send" onclick="sendMessage()">↑</button>

  </div>

</main>

<script src="script.js"></script>

</body>
</html>
